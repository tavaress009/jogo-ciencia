
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Missão Ciência</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <header>
            <div class="icon">🔬</div>
            <h1>Missão Ciência</h1>
            <p>Aprenda, evolua e torne-se um cientista!</p>
        </header>

        <section class="painel">
            <div class="info">
                <span id="nivel">🏅 Nível 1</span>
                <span id="vidas">❤️❤️❤️</span>
                <span>⭐ <strong id="pontos">0</strong></span>
            </div>

            <p id="progressoNivel">Acertos para o próximo nível: 0/5</p>

            <div class="barra">
                <div id="barraProgresso"></div>
            </div>

            <div id="jogo">
                <span id="categoria">🔬 Ciências</span>
                <h2 id="pergunta">Preparando missão...</h2>
                <div id="opcoes"></div>
                <p id="feedback" aria-live="polite"></p>
                <button id="proximo" class="botao" hidden>
                    Continuar →
                </button>
            </div>

            <div id="fimDeJogo" hidden>
                <h2>🏆 Fim de jogo!</h2>
                <p id="resumoFinal"></p>
                <button class="botao" onclick="reiniciarJogo()">
                    🔄 Jogar novamente
                </button>
            </div>
        </section>

        <footer>
            <p>🚀 Cada pergunta é uma nova descoberta!</p>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
